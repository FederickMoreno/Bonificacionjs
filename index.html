<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonificacion</title>
    <script src="js/script.js"></script>
    <h1></h1>
    <script>

        let h1 = crearNodoConTexto('h1', 'Julio Cesar')
        adicionarElementoABody(h1)


        let p = crearNodoConTexto('p', 'Julio César fue un importante político, militar y escritor romano. ')
        adicionarElementoABody(p)


        let h2 = crearNodoConTexto('h2', '¿Quién fue Julio César?')
        adicionarElementoABody(h2)


        let pdos = crearNodoConTexto('p', 'Julio César nació en el año 100 a. C. y tuvo un papel fundamental en la transformación de la República romana. ')
        adicionarElementoABody(pdos)


        let h2dos = crearNodoConTexto('h2', 'Principales logros?')
        adicionarElementoABody(h2dos)

        let ul = crearElemento('ul')
        let li = crearNodoConTexto('li', 'Conquistó gran parte de la Galia.')
        let liDos = crearNodoConTexto('li', 'Fue un destacado líder militar.')
        let liTres = crearNodoConTexto('li', 'Realizó importantes reformas políticas')
        let licuatro = crearNodoConTexto('li', 'Contribuyó al desarrollo del calendario juliano.')

        adicionarElementoAContenedor(li, ul)
        adicionarElementoAContenedor(liDos, ul)
        adicionarElementoAContenedor(liTres, ul)
        adicionarElementoAContenedor(licuatro, ul)


        adicionarElementoABody(ul)


    </script>
</head>

<body>

</body>

</html>
